# Barua — reverse proxy prod (équivalent Casa dashboard : routeRules + apiBase relatif)
#
# Référence (Casa / Nuxt) : `casaFinale/dashboard/nuxt.config.ts`
#   runtimeConfig.public.apiBase = "/api"     → ici : VITE_API_URL=/api/v1 (Vite)
#   routeRules:
#     '/api/**':  { proxy: 'https://migration.casanayo.com/api/**' }
#     '/auth/**': { proxy: 'https://migration.casanayo.com/auth/**' }
#   nitro.devProxy : même idée que vite.config.ts → server.proxy
#
# Ici (Barua / Vite SPA) le backend expose :
#   - REST versionné : /api/v1/...
#   - Auth racine     : /auth/...
#
# Le navigateur reste en https://baruaofficiel.com (same-origin) ; Nginx relaie vers HTTP upstream.
# Changer `server` dans upstream si l’IP/port du serveur API change.

upstream barua_api_upstream {
  server 91.99.168.226:8098;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name baruaofficiel.com www.baruaofficiel.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name baruaofficiel.com www.baruaofficiel.com;

  ssl_certificate     /etc/letsencrypt/live/baruaofficiel.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/baruaofficiel.com/privkey.pem;

  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;

  root /var/www/barua/web/dist;
  index index.html;

  client_max_body_size 25m;

  # ─── Équivalent Casa : proxy /api/**  → ici /api/v1/** vers le même chemin sur l’upstream ───
  location ^~ /api/v1/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_pass http://barua_api_upstream;
  }

  # ─── Auth API (POST) — les GET /auth/login etc. sont des routes Vue, pas l’API ───
  location ^~ /auth/ {
    if ($request_method = GET) {
      rewrite ^ /index.html last;
    }
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_pass http://barua_api_upstream;
  }

  # SPA (Vue Router) — ne pas placer avant les locations /api et /auth
  location / {
    try_files $uri $uri/ /index.html;
  }
}
