# Barua — reverse proxy Nginx (VPS avec dist + proxy vers backend)
#
# Prérequis : le site ne doit PAS être uniquement du statique sans ce proxy.
# Sinon /api/v1 et POST /auth renvoient index.html → site « vide », login en 405.
#
# Backend : https://backend.baruaofficiel.com
# Alternative sans Nginx : .env.production avec URLs backend complètes (CORS OK).

upstream barua_api_upstream {
  server backend.baruaofficiel.com:443;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name baruaofficiel.com www.baruaofficiel.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name baruaofficiel.com www.baruaofficiel.com;

  ssl_certificate     /etc/letsencrypt/live/baruaofficiel.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/baruaofficiel.com/privkey.pem;

  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;

  root /var/www/barua/web/dist;
  index index.html;

  client_max_body_size 25m;

  location ^~ /api/v1/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_set_header Host backend.baruaofficiel.com;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass https://barua_api_upstream;
  }

  # Pages Vue : /auth/login en GET
  location = /auth/login {
    if ($request_method !~ ^(POST|PUT|PATCH|OPTIONS|DELETE)$) {
      rewrite ^ /index.html last;
    }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_set_header Host backend.baruaofficiel.com;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass https://barua_api_upstream;
  }

  location = /auth/register {
    if ($request_method !~ ^(POST|PUT|PATCH|OPTIONS|DELETE)$) {
      rewrite ^ /index.html last;
    }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_set_header Host backend.baruaofficiel.com;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass https://barua_api_upstream;
  }

  location ^~ /auth/ {
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
