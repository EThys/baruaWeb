# Example Nginx reverse proxy for Barua (HTTPS same-origin -> HTTP upstream API)
#
# Goal:
# - Browser calls https://baruaofficiel.com/api/v1/... and https://baruaofficiel.com/auth/...
# - Nginx forwards to http://91.99.168.226:8098/api/v1/... and http://91.99.168.226:8098/auth/...
#
# Notes:
# - Replace ssl_certificate / ssl_certificate_key with your real paths (Let's Encrypt, etc.).
# - Adjust root to your built `dist/` folder (Vite output).
# - If your backend validates Host strictly, you may need proxy_set_header Host 91.99.168.226:8098;

upstream barua_api_upstream {
  server 91.99.168.226:8098;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name baruaofficiel.com www.baruaofficiel.com;

  # Redirect HTTP -> HTTPS (recommended)
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name baruaofficiel.com www.baruaofficiel.com;

  # TLS certificates (example paths)
  ssl_certificate     /etc/letsencrypt/live/baruaofficiel.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/baruaofficiel.com/privkey.pem;

  # Hardening basics (tune to your policy)
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;

  # Static frontend (Vite `npm run build` output)
  root /var/www/barua/web/dist;
  index index.html;

  # If you accept file uploads through the API proxy, raise as needed
  client_max_body_size 25m;

  # ─── API proxy ─────────────────────────────────────────────────────────────
  location ^~ /api/v1/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_pass http://barua_api_upstream;
  }

  # Auth lives at /auth/* on the backend (NOT under /api/v1)
  location ^~ /auth/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_pass http://barua_api_upstream;
  }

  # ─── SPA fallback ──────────────────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }
}
